<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380">
<!--
  Physical / logistics template icons
  =====================================
  One <symbol> per semantic template type.
  All symbols use viewBox="0 0 48 48".

  Colour palette
  ──────────────
  Box base   : amber   — stroke #D97706, fill #FFFBEB / #FDE68A
  Person     : teal    — stroke #0D9488, fill #CCFBF1
  Scale      : blue    — stroke #0369A1, fill #EFF6FF
  Agent/Entity init: neutral #374151 / purple #7C3AED
  Badge (top-right): creating=green+, same as template-icons.svg
-->

<defs>

<!-- ═══════════════════════════════════════════════════════════════════
     HELPER: amber box base reused across packing/unpacking symbols
     Box body: rect x=5 y=18 w=30 h=24 rx=2
     Lid crease: line y1=26
     Dashed seam: line x1=20 dashed
     ═══════════════════════════════════════════════════════════════════ -->

<!-- 1. icon-transporting
     Meaning: generic transport of a physical object (not goods-specific).
     Same amber box with rightward arrow, plus three speed-lines to the left. -->
<symbol id="icon-org.openprovenance.templates.transport.Transporting" viewBox="0 0 48 48" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
  <!-- Speed / motion lines (left of box) -->
  <line x1="1" y1="22" x2="5" y2="22" stroke="#D97706" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="1" y1="26" x2="5" y2="26" stroke="#D97706" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="1" y1="30" x2="5" y2="30" stroke="#D97706" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Box body (shifted right slightly) -->
  <rect x="6" y="18" width="28" height="22" rx="2"
        fill="#FFFBEB" stroke="#D97706" stroke-width="2"
        stroke-linejoin="round"/>
  <!-- Lid crease -->
  <line x1="6" y1="26" x2="34" y2="26" stroke="#D97706" stroke-width="2"/>
  <!-- Centre seam -->
  <line x1="20" y1="18" x2="20" y2="40"
        stroke="#D97706" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- Transport arrow (right) -->
  <line x1="35" y1="29" x2="46" y2="29"
        stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="40,23 46,29 40,35"
            fill="none" stroke="#374151" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 2. icon-handing-over
     Meaning: transfer of custody between two agents.
     Two person silhouettes facing each other, small object between them,
     rightward arrow indicating handover. -->
<symbol id="icon-org.openprovenance.templates.transport.HandingOver" viewBox="0 0 48 48" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
  <!-- Left person: head -->
  <circle cx="9" cy="13" r="4" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <!-- Left person: shoulders (arc) -->
  <path d="M2,30 Q9,22 16,30" fill="none" stroke="#0D9488" stroke-width="1.5"/>
  <!-- Right person: head -->
  <circle cx="39" cy="13" r="4" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <!-- Right person: shoulders (arc) -->
  <path d="M32,30 Q39,22 46,30" fill="none" stroke="#0D9488" stroke-width="1.5"/>
  <!-- Handed-over object (small square, centred) -->
  <rect x="21" y="23" width="6" height="6" rx="1"
        fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
  <!-- Arrow from left person to object / right person -->
  <line x1="16" y1="26" x2="21" y2="26"
        stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <polyline points="18,23 21,26 18,29"
            fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 3. icon-weighing
     Meaning: weighing on a scale / balance.
     Central post, horizontal beam, two hanging chains, two pans, triangle pointer. -->
<symbol id="icon-org.openprovenance.templates.transport.Weighing" viewBox="0 0 48 48" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
  <!-- Central post -->
  <line x1="24" y1="14" x2="24" y2="40" stroke="#0369A1" stroke-width="2"/>
  <!-- Base of post -->
  <line x1="18" y1="40" x2="30" y2="40" stroke="#0369A1" stroke-width="2"/>
  <!-- Horizontal beam -->
  <line x1="10" y1="20" x2="38" y2="20" stroke="#0369A1" stroke-width="2"/>
  <!-- Left chain -->
  <line x1="10" y1="20" x2="10" y2="28" stroke="#0369A1" stroke-width="1.5"/>
  <!-- Right chain -->
  <line x1="38" y1="20" x2="38" y2="28" stroke="#0369A1" stroke-width="1.5"/>
  <!-- Left pan (semi-circle arc) -->
  <path d="M6,28 Q10,36 14,28" fill="#EFF6FF" stroke="#0369A1" stroke-width="1.5"/>
  <!-- Right pan (semi-circle arc) -->
  <path d="M34,28 Q38,36 42,28" fill="#EFF6FF" stroke="#0369A1" stroke-width="1.5"/>
  <!-- Triangle pointer at top of post -->
  <polygon points="22,14 26,14 24,10" fill="#0369A1" stroke="none"/>
  <!-- Pivot dot -->
  <circle cx="24" cy="20" r="2" fill="#0369A1" stroke="none"/>
</symbol>

<!-- 4. icon-agent-init
     Meaning: initialising an agent (person entity).
     Person silhouette (head + shoulders) + green "+" badge. -->
<symbol id="icon-org.openprovenance.templates.transport.AgentInit" viewBox="0 0 48 48" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
  <!-- Person head (centred-left) -->
  <circle cx="18" cy="14" r="7" fill="#F9FAFB" stroke="#374151" stroke-width="2"/>
  <!-- Person shoulders arc -->
  <path d="M6,38 Q18,28 30,38" fill="none" stroke="#374151" stroke-width="2"/>
  <!-- Badge background (green "+") -->
  <circle cx="40" cy="9" r="7" fill="white" stroke="#15803D" stroke-width="1.5"/>
  <!-- + (creation) -->
  <line x1="37" y1="9" x2="43" y2="9"
        stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="6" x2="40" y2="12"
        stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
</symbol>

<!-- 5. icon-entity-init
     Meaning: initialising a generic entity.
     Rounded rect (PROV entity) + green "+" badge. -->
<symbol id="icon-org.openprovenance.templates.transport.EntityInit" viewBox="0 0 48 48" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
  <!-- Entity rectangle -->
  <rect x="6" y="16" width="28" height="20" rx="4"
        fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <!-- Small label lines inside entity rect -->
  <line x1="10" y1="23" x2="30" y2="23" stroke="#C4B5FD" stroke-width="1.5"/>
  <line x1="10" y1="29" x2="24" y2="29" stroke="#C4B5FD" stroke-width="1.5"/>
  <!-- Badge background (green "+") -->
  <circle cx="40" cy="9" r="7" fill="white" stroke="#15803D" stroke-width="1.5"/>
  <!-- + (creation) -->
  <line x1="37" y1="9" x2="43" y2="9"
        stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="6" x2="40" y2="12"
        stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
</symbol>

<!-- 6. icon-packing
     Meaning: packing one item into a box.
     Open-lid box (flaps) + single item above + downward arrow. -->
<symbol id="icon-org.openprovenance.templates.transport.Packing" viewBox="0 0 48 48" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
  <!-- Box body (open top — no lid crease, just box walls) -->
  <rect x="5" y="20" width="30" height="22" rx="2"
        fill="#FFFBEB" stroke="#D97706" stroke-width="2"
        stroke-linejoin="round"/>
  <!-- Open lid flaps -->
  <line x1="5" y1="20" x2="2" y2="12" stroke="#D97706" stroke-width="2"/>
  <line x1="35" y1="20" x2="38" y2="12" stroke="#D97706" stroke-width="2"/>
  <!-- Item above the box -->
  <rect x="15" y="4" width="10" height="8" rx="1"
        fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <!-- Downward arrow from item into box -->
  <line x1="20" y1="12" x2="20" y2="18" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <polyline points="17,16 20,19 23,16"
            fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 7. icon-packing-composite
     Meaning: packing multiple items into one box.
     Open-lid box + three small items above + three converging arrows. -->
<symbol id="icon-org.openprovenance.templates.transport.PackingComposite" viewBox="0 0 48 48" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
  <!-- Box body -->
  <rect x="5" y="22" width="30" height="20" rx="2"
        fill="#FFFBEB" stroke="#D97706" stroke-width="2"
        stroke-linejoin="round"/>
  <!-- Open lid flaps -->
  <line x1="5" y1="22" x2="2" y2="14" stroke="#D97706" stroke-width="2"/>
  <line x1="35" y1="22" x2="38" y2="14" stroke="#D97706" stroke-width="2"/>
  <!-- Three items above the box -->
  <rect x="4"  y="4" width="8" height="7" rx="1"
        fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <rect x="16" y="4" width="8" height="7" rx="1"
        fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <rect x="28" y="4" width="8" height="7" rx="1"
        fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <!-- Converging arrows from each item down to box opening -->
  <line x1="8"  y1="11" x2="16" y2="20" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="13,18 16,21 19,18"
            fill="none" stroke="#374151" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="20" y1="11" x2="20" y2="20" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="17,18 20,21 23,18"
            fill="none" stroke="#374151" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="32" y1="11" x2="24" y2="20" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="21,18 24,21 27,18"
            fill="none" stroke="#374151" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 8. icon-unpacking
     Meaning: unpacking one item from a box.
     Open-lid box + single item above + upward arrow. Reverse of packing. -->
<symbol id="icon-org.openprovenance.templates.transport.Unpacking" viewBox="0 0 48 48" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
  <!-- Box body -->
  <rect x="5" y="20" width="30" height="22" rx="2"
        fill="#FFFBEB" stroke="#D97706" stroke-width="2"
        stroke-linejoin="round"/>
  <!-- Open lid flaps -->
  <line x1="5" y1="20" x2="2" y2="12" stroke="#D97706" stroke-width="2"/>
  <line x1="35" y1="20" x2="38" y2="12" stroke="#D97706" stroke-width="2"/>
  <!-- Item above the box (destination) -->
  <rect x="15" y="4" width="10" height="8" rx="1"
        fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <!-- Upward arrow from box to item -->
  <line x1="20" y1="19" x2="20" y2="13" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <polyline points="17,15 20,12 23,15"
            fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 9. icon-unpacking-composite
     Meaning: unpacking multiple items from one box.
     Open-lid box + three items above + three diverging upward arrows. Reverse of packing-composite. -->
<symbol id="icon-org.openprovenance.templates.transport.UnpackingComposite" viewBox="0 0 48 48" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
  <!-- Box body -->
  <rect x="5" y="22" width="30" height="20" rx="2"
        fill="#FFFBEB" stroke="#D97706" stroke-width="2"
        stroke-linejoin="round"/>
  <!-- Open lid flaps -->
  <line x1="5" y1="22" x2="2" y2="14" stroke="#D97706" stroke-width="2"/>
  <line x1="35" y1="22" x2="38" y2="14" stroke="#D97706" stroke-width="2"/>
  <!-- Three items above the box (destinations) -->
  <rect x="4"  y="4" width="8" height="7" rx="1"
        fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <rect x="16" y="4" width="8" height="7" rx="1"
        fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <rect x="28" y="4" width="8" height="7" rx="1"
        fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <!-- Diverging arrows from box up to each item -->
  <line x1="16" y1="21" x2="8"  y2="12" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="5,14 8,11 11,14"
            fill="none" stroke="#374151" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="20" y1="21" x2="20" y2="12" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="17,14 20,11 23,14"
            fill="none" stroke="#374151" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="24" y1="21" x2="32" y2="12" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="29,14 32,11 35,14"
            fill="none" stroke="#374151" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

</defs>

<!-- ══════════════════════════════════════════════════════════════════
     PREVIEW SHEET — 3 rows × 3 columns
     Cell width ~170px, cell height ~110px
     ══════════════════════════════════════════════════════════════════ -->

<rect width="560" height="380" fill="#F9FAFB"/>
<text x="12" y="22" font-family="monospace" font-size="13" fill="#111827" font-weight="bold">
  Transport / logistics template icons
</text>

<!-- Row 1: transporting, handing-over, weighing -->
<use href="#icon-org.openprovenance.templates.transport.Transporting"  x="18"  y="34" width="64" height="64"/>
<use href="#icon-org.openprovenance.templates.transport.HandingOver"  x="188" y="34" width="64" height="64"/>
<use href="#icon-org.openprovenance.templates.transport.Weighing"      x="358" y="34" width="64" height="64"/>

<text x="50"  y="112" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#374151">transporting</text>
<text x="220" y="112" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#374151">handing-over</text>
<text x="390" y="112" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#374151">weighing</text>

<!-- Row 2: agent-init, entity-init, packing -->
<use href="#icon-org.openprovenance.templates.transport.AgentInit"   x="18"  y="144" width="64" height="64"/>
<use href="#icon-org.openprovenance.templates.transport.EntityInit"  x="188" y="144" width="64" height="64"/>
<use href="#icon-org.openprovenance.templates.transport.Packing"      x="358" y="144" width="64" height="64"/>

<text x="50"  y="222" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#374151">agent-init</text>
<text x="220" y="222" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#374151">entity-init</text>
<text x="390" y="222" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#374151">packing</text>

<!-- Row 3: packing-composite, unpacking, unpacking-composite -->
<use href="#icon-org.openprovenance.templates.transport.PackingComposite"   x="18"  y="254" width="64" height="64"/>
<use href="#icon-org.openprovenance.templates.transport.Unpacking"           x="188" y="254" width="64" height="64"/>
<use href="#icon-org.openprovenance.templates.transport.UnpackingComposite" x="358" y="254" width="64" height="64"/>

<text x="50"  y="332" text-anchor="middle" font-family="monospace" font-size="9" fill="#374151">packing</text>
<text x="50"  y="343" text-anchor="middle" font-family="monospace" font-size="9" fill="#374151">-composite</text>
<text x="220" y="332" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#374151">unpacking</text>
<text x="390" y="332" text-anchor="middle" font-family="monospace" font-size="9" fill="#374151">unpacking</text>
<text x="390" y="343" text-anchor="middle" font-family="monospace" font-size="9" fill="#374151">-composite</text>

</svg>
