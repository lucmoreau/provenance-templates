  <line x1="10" y1="24" x2="34" y2="24" stroke="#A5B4FC" stroke-width="1.5"/>
  <line x1="10" y1="30" x2="28" y2="30" stroke="#A5B4FC" stroke-width="1.5"/>
  <!-- Badge background -->
  <circle cx="40" cy="9" r="6" fill="white" stroke="#15803D" stroke-width="1.5"/>
  <!-- + (creation) -->
  <line x1="37" y1="9" x2="43" y2="9" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="6" x2="40" y2="12" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>
