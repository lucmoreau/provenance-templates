  <!-- Pivot dot -->
  <circle cx="24" cy="20" r="2" fill="#0369A1" stroke="none"/>
</symbol>
</defs>
<use href="#icon-org.openprovenance.templates.transport.Weighing" xlink:href="#icon-org.openprovenance.templates.transport.Weighing" width="50" height="50"/>
