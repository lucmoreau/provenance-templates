<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="50" height="50" viewBox="0 0 48 48">
<defs>
<symbol id="icon-org.openprovenance.templates.transport.PackingComposite" viewBox="0 0 48 48" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
  <!-- Box body -->
  <rect x="5" y="22" width="30" height="20" rx="2" fill="#FFFBEB" stroke="#D97706" stroke-width="2" stroke-linejoin="round"/>
  <!-- Open lid flaps -->
  <line x1="5" y1="22" x2="2" y2="14" stroke="#D97706" stroke-width="2"/>
  <line x1="35" y1="22" x2="38" y2="14" stroke="#D97706" stroke-width="2"/>
  <!-- Three items above the box -->
  <rect x="4" y="4" width="8" height="7" rx="1" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <rect x="16" y="4" width="8" height="7" rx="1" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <rect x="28" y="4" width="8" height="7" rx="1" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <!-- Converging arrows from each item down to box opening -->
  <line x1="8" y1="11" x2="16" y2="20" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="13,18 16,21 19,18" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="20" y1="11" x2="20" y2="20" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="17,18 20,21 23,18" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="32" y1="11" x2="24" y2="20" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="21,18 24,21 27,18" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>
</defs>
<use href="#icon-org.openprovenance.templates.transport.PackingComposite" xlink:href="#icon-org.openprovenance.templates.transport.PackingComposite" width="50" height="50"/>
</svg>
