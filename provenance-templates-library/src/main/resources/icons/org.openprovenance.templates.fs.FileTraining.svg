  <polyline points="32,4 32,10 38,10" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linejoin="round"/>
  <line x1="10" y1="18" x2="34" y2="18" stroke="#A5B4FC" stroke-width="1.5"/>
  <line x1="10" y1="24" x2="34" y2="24" stroke="#A5B4FC" stroke-width="1.5"/>
