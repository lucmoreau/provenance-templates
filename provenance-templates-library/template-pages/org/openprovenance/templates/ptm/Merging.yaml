Name: Merging
Fully Qualified Name: org.openprovenance.templates.ptm.Merging
IRI: <https://openprovenance.org/templates/org/openprovenance/templates/ptm/Merging>
Purpose: The Merging template describes the merging of two templates.
Context: The template describes one of the two key operations in provenance template management.
Design considerations: The ability to trace the creation of provenance templates.
Automation: (ttfs/config-ptm.json)(https://github.com/lucmoreau/provenance-templates/blob/main/provenance-templates-library/src/main/resources/ttfs/config-ptm.json)
Figure: (org.openprovenance.templates.ptm.Merging)(project/template-intro1/target/generated-templates/org/openprovenance/templates/ptm/ptm-merging.svg){#fig:org.openprovenance.templates.ptm.Merging}
Details: |-
  In this template, there are four entities: two serve as inputs, template1 and template2, while the other two serve as outputs, a document document and its provenance provenance. The activity merging combines the two input templates and generates a new provenance document, which is a provenance template. An agent agent is associated with merging, and both outputs are attributed to it. The template is an instantiation of Product2-2: each output is derived from both inputs.
  To document the execution of the merging algorithm, the activity also generates a provenance document in the form of compact bindings (see (Section @sec:alternate.external.bindings.representation)).
