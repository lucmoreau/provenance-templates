Name: Transforming1
Fully Qualified Name: org.openprovenance.templates.generic.Transforming1
IRI: <https://openprovenance.org/templates/org/openprovenance/templates/generic/Transforming1>
Purpose: The template Transforming1 describes how an input is transformed into an output.
Context: It is intended as a general form of transformation, with a single input and a single output.
Design considerations: Relations rigorously linking nodes using pre-defined triangles.
Automation: (ttfs/config-generic-transforming.json)(https://github.com/lucmoreau/provenance-templates/blob/main/provenance-templates-library/src/main/resources/ttfs/config-generic-transforming.json)
Figure: (org.openprovenance.templates.generic.Transforming1)(project/template-intro1/target/generated-templates/org/openprovenance/templates/generic/transforming/transforming1.qualified.svg){#fig:org.openprovenance.templates.generic.Transforming1}
Details: |-
  There are two entities directly related to the transformation: input and output; an activity transforming; an agent agent; and an associated plan plan. The template is constructed by instantiating two templates:
  - The template Triangle1-Entity-UGD links the output to the input through a derivation, underpinned by the activity transforming, which used the input to generate the output.
  - The template Triangle3-AGA introduces an agent (and a plan) that is associated with the activity and bears responsibility for the generated output.
  While simple, this template is very general. It can be readily instantiated for different applications and domain types. Using multiplicities, it can also be instantiated for different topologies. Extensibility variables such as var:oprops (for the output) allow types or roles to be defined for different situations.
