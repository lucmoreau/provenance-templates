<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="50" height="50" viewBox="0 0 48 48">
<defs>
<symbol id="icon-org.openprovenance.templates.transport.Unpacking" viewBox="0 0 48 48" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
  <!-- Box body -->
  <rect x="5" y="20" width="30" height="22" rx="2" fill="#FFFBEB" stroke="#D97706" stroke-width="2" stroke-linejoin="round"/>
  <!-- Open lid flaps -->
  <line x1="5" y1="20" x2="2" y2="12" stroke="#D97706" stroke-width="2"/>
  <line x1="35" y1="20" x2="38" y2="12" stroke="#D97706" stroke-width="2"/>
  <!-- Item above the box (destination) -->
  <rect x="15" y="4" width="10" height="8" rx="1" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <!-- Upward arrow from box to item -->
  <line x1="20" y1="19" x2="20" y2="13" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <polyline points="17,15 20,12 23,15" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>
</defs>
<use href="#icon-org.openprovenance.templates.transport.Unpacking" xlink:href="#icon-org.openprovenance.templates.transport.Unpacking" width="50" height="50"/>
</svg>
